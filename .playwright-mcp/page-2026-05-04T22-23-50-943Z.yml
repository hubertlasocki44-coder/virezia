      - generic [ref=e44]:
        - paragraph [ref=e45]: Why He Returned
        - paragraph [ref=e46]: Couturier has worked in Mexico for over four decades. When the developers of Las Orcas approached him about Puerto Escondido, his answer was personal before it was professional.
        - generic [ref=e47]:
          - blockquote [ref=e48]:
            - paragraph [ref=e49]: “What I love about Mexico is the incredible kindness of its people, the devotion of its workers, and their intelligence in making your dream come true.”
          - blockquote [ref=e50]:
            - paragraph [ref=e51]: “Puerto Escondido is being discovered. Most of the developments there are environmentally friendly, family-friendly. You don't have the feeling that you live on top of each other.”
        - paragraph [ref=e52]: — Robert Couturier
