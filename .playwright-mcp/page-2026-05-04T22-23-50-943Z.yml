      - generic [ref=e69]:
        - paragraph [ref=e70]: VIREZIA Selections
        - paragraph [ref=e71]: Las Orcas is part of VIREZIA Selections — a small set of curated opportunities reviewed for architectural significance, regulatory integrity, and the seriousness of the process behind them.
      - generic [ref=e74]:
        - img "Las Orcas villa — designed by Robert Couturier" [ref=e77]
        - generic [ref=e78]:
          - paragraph [ref=e79]: Las Orcas
          - paragraph [ref=e80]: Seven private residences on a single beachfront parcel in Puerto Escondido, Oaxaca — four villas and three casitas, designed by Robert Couturier as a small village. “So that when you walk through from the entrance to the upper bungalows,” he says, “you have a feeling that you're walking through a small little city.”
          - paragraph [ref=e81]: The construction is in concrete and stone — materials chosen, in his words, “that will live in the sea air and age gracefully — as we all should.” Spaces are designed to be open but cozy. “You don't have the feeling that you live outside all the time. You have the ability to be outside, and the ability to stay inside and read a book.”
          - paragraph [ref=e82]: Each residence has its own private deed and rooftop plunge pool. Pre-construction. Pre-titled lots. Direct access to the uncrowded beach of La Barra. Five residences remain available to founding members.
          - paragraph [ref=e83]: From $561,000.
      - generic [ref=e86]:
        - blockquote [ref=e87]:
          - paragraph [ref=e88]: “What will distinguish Las Orcas is the care with which it was designed and built. Luxury but also simplicity.”
        - blockquote [ref=e89]:
