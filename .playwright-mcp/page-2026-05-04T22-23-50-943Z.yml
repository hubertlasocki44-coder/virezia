      - generic [ref=e94]:
        - paragraph [ref=e95]: The Neighborhood
        - paragraph [ref=e96]: "The Pacific Coast of Oaxaca has become, quietly, the most concentrated architectural destination in Mexico. Within thirty minutes of Las Orcas:"
        - generic [ref=e97]:
          - paragraph [ref=e98]: Casa Wabi — Tadao Ando. Pritzker Prize, 1995. With pavilions by Álvaro Siza, Kengo Kuma, Alberto Kalach, Solano Benítez and Gloria Cabral.
          - paragraph [ref=e99]: Casona Sforza — Alberto Kalach. La Barra.
          - paragraph [ref=e100]: Hotel Escondido — Grupo Habita. Member of Design Hotels.
          - paragraph [ref=e101]: Hotel Terrestre — Alberto Kalach. Solar-powered, member of Design Hotels.
          - paragraph [ref=e102]: Casa TO — Ludwig Godefroy. La Punta.
        - generic [ref=e103]:
          - paragraph [ref=e104]: Until now, this architecture could be visited. It could not be inhabited.
          - paragraph [ref=e105]: Las Orcas is the first private residential project at this tier on the Oaxacan Coast.
      - generic [ref=e108]:
        - paragraph [ref=e109]: The Build
        - paragraph [ref=e110]: Construction by Quantia, the Puerto Escondido studio responsible for Casa Sicarú and Casa Madrina. Materials drawn from the region — Cantera Verde stone, Parota wood, Talavera tile, breeze blocks — selected for permanence in the sea air. Saltwater pools. Whole-home water filtration. Ten-inch walls and dual-pane glass to soften the climate. Each residence is delivered with private deed under Mexican federal title.
        - paragraph [ref=e111]: "Estimated construction: Q2 2026 — Q3 2027."
