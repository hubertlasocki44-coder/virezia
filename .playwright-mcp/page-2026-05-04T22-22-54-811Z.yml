    - generic [ref=e15]:
      - generic [ref=e16]: The Approach
      - heading "The Approach" [level=1] [ref=e17]
      - paragraph [ref=e18]: VIREZIA exists because the way exceptional properties are usually presented does them a disservice.
      - paragraph [ref=e19]: Most homes are listed. A small number deserve to be introduced.
      - paragraph [ref=e20]: These are the ones we work with.
    - generic [ref=e23]:
      - heading "What we feature" [level=2] [ref=e24]
      - paragraph [ref=e25]: "Every property featured on VIREZIA is selected personally for one or more of the following:"
      - generic [ref=e26]:
        - paragraph [ref=e27]: — Architectural or design distinction
        - paragraph [ref=e28]: — Location with character
        - paragraph [ref=e29]: — A story worth telling
        - paragraph [ref=e30]: — A defined investment thesis
        - paragraph [ref=e31]: — Off-market access not available elsewhere
      - paragraph [ref=e32]: We feature a defined number of properties at any time. Not the largest. Not the cheapest. The right ones for the right buyer.
    - generic [ref=e35]:
      - heading "If you are looking to acquire" [level=2] [ref=e36]
      - paragraph [ref=e37]: You apply. We respond personally within 48 hours.
      - paragraph [ref=e38]: If there is alignment between what you are looking for and what we are featuring or sourcing, we begin a private conversation.
      - paragraph [ref=e39]: What follows is shaped by the property and by you — not by a fixed process diagram.
    - generic [ref=e42]:
      - heading "If you own a property worth featuring" [level=2] [ref=e43]
      - paragraph [ref=e44]: Owners and developers approach VIREZIA when they want their property told properly — and placed in front of buyers who will value it.
      - paragraph [ref=e45]: Featured selection is reviewed quarterly. Inclusion is by invitation following submission.
      - link "Submit a property →" [ref=e46] [cursor=pointer]:
        - /url: /for-owners
    - generic [ref=e49]:
      - heading "What we do not do" [level=2] [ref=e50]
      - generic [ref=e51]:
        - paragraph [ref=e52]: We do not list.
        - paragraph [ref=e53]: We do not browse.
        - paragraph [ref=e54]: We do not work with mass-market product.
        - paragraph [ref=e55]: We do not feature what we would not personally consider exceptional.
      - paragraph [ref=e56]: Selectivity is the entire point.
    - link "Apply for Private Access" [ref=e60] [cursor=pointer]:
