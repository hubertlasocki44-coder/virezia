          - heading "Robert Couturier" [level=2] [ref=e25]
          - paragraph [ref=e26]: Paris-trained architect and interior designer. Based in New York since 1981. His work spans four continents — from Manhattan townhouses to estates in France, England, Russia, the Middle East, and Mexico.
          - paragraph [ref=e27]: Named to the AD100 — Architectural Digest's definitive list of the world's top architects and designers. Author of Designing Paradises, published by Rizzoli. Clients have included Sir James Goldsmith and Jeff Koons.
