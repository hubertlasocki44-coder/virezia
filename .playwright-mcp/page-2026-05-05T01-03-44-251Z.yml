        - paragraph [ref=e158]: The Build
        - paragraph [ref=e159]: Construction by Quantia, the Puerto Escondido studio responsible for Casa Sicarú and Casa Madrina. Materials drawn from the region — Cantera Verde stone, Parota wood, Talavera tile, breeze blocks — selected for permanence in the sea air. Saltwater pools. Whole-home water filtration. Ten-inch walls and dual-pane glass to soften the climate. Each residence is delivered with private deed under Mexican federal title.
