        - generic [ref=e42]:
          - paragraph [ref=e43]: "1987"
          - paragraph [ref=e44]: In the autumn of 1987, after the stock market crash, Sir James Goldsmith — the Anglo-French financier — withdrew from the world he had spent thirty years building. He bought twenty thousand acres on the Pacific Coast of Mexico and began to imagine what it might become.
          - paragraph [ref=e45]: "He had recently commissioned a young French architect, newly arrived in New York, to decorate his Manhattan townhouse. He now offered him something larger: the design of an entire world."
          - paragraph [ref=e46]: Robert Couturier was thirty-two. The commission was, by his own biographer's account, the single greatest private commission of modern times. It would last a decade. It would expand to include a sixty-thousand-square-foot palace called La Loma, its blue-and-yellow tiled dome modeled after Hagia Sophia. A Boeing 757 — “a flying carpet with a motor,” Couturier called it. A French château. A double-width Manhattan home.
          - paragraph [ref=e47]: The estate became Cuixmala — “the soul's resting place” in the Nahuatl language. Architectural Digest later named it among the seven most beautiful resorts on Mexico's Pacific Coast. It hosted Henry Kissinger, Madonna, Bill Gates. It launched Robert Couturier's career.
          - paragraph [ref=e48]: Las Orcas is his return to that coast.
