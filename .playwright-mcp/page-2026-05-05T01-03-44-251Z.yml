          - paragraph [ref=e96]: Las Orcas
          - paragraph [ref=e97]: Seven private residences on a single beachfront parcel — four villas and three casitas, designed by Robert Couturier as a small village. “So that when you walk through from the entrance to the upper bungalows,” he says, “you have a feeling that you're walking through a small little city.”
          - paragraph [ref=e98]: The construction is in concrete and stone — materials chosen, in his words, “that will live in the sea air and age gracefully — as we all should.” Spaces are designed to be open but cozy. “You don't have the feeling that you live outside all the time. You have the ability to be outside, and the ability to stay inside and read a book.”
          - paragraph [ref=e99]: Each residence has its own private deed and rooftop plunge pool. Pre-construction. Pre-titled lots. Direct access to the uncrowded beach of La Barra. Seven residences in total — three casitas and four villas, ranging from two to three bedrooms. Five remain available to founding members.
          - paragraph [ref=e100]: From $561,000.
