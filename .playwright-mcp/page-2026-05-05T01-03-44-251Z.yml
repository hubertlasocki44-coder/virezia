          - paragraph [ref=e77]: The Place
          - heading "Puerto Escondido, Oaxaca" [level=2] [ref=e78]
          - paragraph [ref=e79]: "Puerto Escondido began as a surfers' secret — a stretch of Pacific coastline known only to those who sought it out. It has since become one of Mexico's most compelling destinations: unhurried, culturally rich, and architecturally awake in a way that few coastal towns anywhere in the world can match."
          - paragraph [ref=e80]: Oaxaca's food culture — rooted in indigenous tradition, refined by a generation of internationally recognized chefs — is considered among the most sophisticated in Mexico. The coast itself remains uncrowded. The pace is slow. The light is extraordinary.
          - paragraph [ref=e81]: "In the last five years, this stretch of coast has quietly attracted the greatest concentration of world-class architecture in Mexico: Tadao Ando, Alberto Kalach, Ludwig Godefroy. Until now, that architecture could only be visited. Las Orcas is the first opportunity to inhabit it."
