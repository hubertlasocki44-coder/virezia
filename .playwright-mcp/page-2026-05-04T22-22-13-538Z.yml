      - generic [ref=e37]: What VIREZIA Is
      - heading "A curated real estate network." [level=2] [ref=e38]
      - paragraph [ref=e39]: VIREZIA is not a listing portal. We don't publish properties on the public homepage.
      - paragraph [ref=e40]: We select real estate from across the market — architectural, design-led, location-driven, investment-grade — and present each property inside VIREZIA Circle.
      - paragraph [ref=e41]: International investors apply to create a profile and access opportunities. Developers and asset owners apply to submit properties for selection. Each application is reviewed personally.
    - generic [ref=e44]:
      - generic [ref=e45]: The Approach
      - heading "We don't list properties. We select them." [level=2] [ref=e46]:
        - text: We don't list properties.
        - text: We select them.
      - paragraph [ref=e47]: Every property in VIREZIA Circle is selected personally — for its architecture, design, location, story, investment thesis, or off-market access.
      - paragraph [ref=e48]: We work with the owners and developers behind each property to present it the way it deserves to be presented.
      - paragraph [ref=e49]: Some properties we feature are off the public market. Others are publicly available, but worth a closer look than the noise around them allows.
      - paragraph [ref=e50]: If a property earns a closer look, we feature it. If it doesn't, we don't.
      - link "Read the full approach →" [ref=e51] [cursor=pointer]:
